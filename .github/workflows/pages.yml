# D-02 / D-05 / D-06 : tests, puis publication de dist/ sur GitHub Pages.
# D-G-014 : chaque fusion dans main crée le tag et la release v<version de package.json>
# (si absents), puis publie. Retour arrière : relancer à la main avec le tag précédent.
name: Publier SuperChef.ai

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag à publier (ex. v1.0.0)'
        required: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test

  publier:
    if: github.event_name != 'pull_request'
    needs: tests
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Créer le tag et la release de la version
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(node -p "require('./package.json').version")
          if gh release view "v$V" >/dev/null 2>&1; then
            echo "v$V existe déjà, on publie seulement."
          else
            node -e "const r=require('./docs/releases/'+process.argv[1]+'.json'); require('fs').writeFileSync('notes.md', r.mvp+'\n\n'+r.nouveautes.map(n=>'- '+n).join('\n')+'\n')" "$V"
            gh release create "v$V" --target "$GITHUB_SHA" --title "$V" --notes-file notes.md
          fi
          # D-G-031 : l'archive à déployer sur Hostinger, jointe à la release.
          node scripts/paquet.mjs
          gh release upload "v$V" "paquet/superchef-$V.zip" --clobber
      - name: Joindre les notes de version
        run: mkdir -p dist/releases && cp docs/releases/*.json dist/releases/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploiement
        uses: actions/deploy-pages@v4
